<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TILQA — تجربة المستندات</title><style>:root{--g:#143d30;--gold:#a17c36}*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#22342d;font-family:Tahoma,Arial,sans-serif}header{background:var(--g);color:white;padding:22px;text-align:center}header b{font-size:27px;color:#e2c387}main{max-width:950px;margin:18px auto;padding:0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{background:var(--g);color:white;border:0;border-radius:8px;padding:12px 17px;cursor:pointer;font-size:15px}.tabs button{background:#e5e9e4;color:#173e31}.tabs button.active{background:var(--g);color:white}.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 20px #193b2920}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:bold}input,textarea{display:block;width:100%;border:1px solid #ccd7ce;border-radius:7px;padding:11px;font:inherit;margin-top:5px}textarea{min-height:100px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}table{border-collapse:collapse;width:100%;margin:10px 0}th,td{border:1px solid #d5ded8;padding:9px;text-align:center}th{background:#edf2ee}.row-input{min-width:65px}.remove{background:#8d423b;padding:8px}#preview{display:none;margin-top:20px;background:white;padding:32px;border:1px solid #d5ded8;min-height:500px}#preview .ph{display:flex;justify-content:space-between;align-items:start;border-bottom:2px solid var(--gold);padding-bottom:16px}#preview .mark{font-size:28px;font-weight:bold;color:var(--g);direction:ltr}#preview h2{text-align:center;margin:35px 0 22px}#preview .body{white-space:pre-wrap;line-height:2}#preview footer{border-top:1px solid #bbb;margin-top:50px;padding-top:12px;color:#666;font-size:12px}.muted{color:#666;font-size:13px}.hidden{display:none!important}@media(max-width:600px){.fields{grid-template-columns:1fr}.panel{padding:14px}#preview{padding:14px}}@media print{body{background:white}header,main>.tabs,#editor,.actions,.muted{display:none!important}main{max-width:none;margin:0;padding:0}#preview{display:block!important;border:0;margin:0;min-height:0;padding:0}.panel{box-shadow:none;padding:0} @page{size:A4;margin:16mm}}</style><header><b>TILQA</b><div>تلقا — تجربة النماذج الذكية</div></header><main><div class="tabs" id="tabs"></div><div class="panel"><div id="editor"><div class="fields"><label>اسم الجهة المصدرة<input id="company" placeholder="اسم المنشأة القانوني"></label><label>رقم المستند<input id="number" placeholder="TQ-2026-0001"></label><label>التاريخ<input type="date" id="date"></label><label>اسم المستلم / العميل<input id="recipient" placeholder="اسم الجهة"></label><label class="full">الموضوع<input id="subject" placeholder="موضوع المستند"></label><label class="full">المحتوى / الملاحظات<textarea id="body" placeholder="اكتب التفاصيل هنا"></textarea></label></div><div id="quote"><h3>بنود عرض السعر</h3><div style="overflow-x:auto"><table><thead><tr><th>الوصف</th><th>الكمية</th><th>السعر</th><th>إزالة</th></tr></thead><tbody id="rows"></tbody></table></div><button type="button" onclick="addRow()">+ إضافة صف</button><label>الضريبة %<input type="number" id="tax" value="15" min="0" max="100" style="max-width:120px"></label></div></div><div class="actions"><button onclick="preview()">معاينة المستند</button><button onclick="printDoc()">طباعة / PDF</button><button onclick="resetDoc()">مستند جديد</button></div><p class="muted">تجربة عامة ببيانات افتراضية. لا تدخل بيانات عملاء حقيقية. لا تُحفظ البيانات على خادم.</p><section id="preview"></section></div></main><script>const types=['عرض سعر','خطاب','تقرير','قرار إداري','بوليصة شحن'];let type=types[0];const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderTabs(){el('tabs').innerHTML=types.map(t=>'<button class="'+(t===type?'active':'')+'" onclick="setType(\''+t+'\')">'+t+'</button>').join('')}function setType(t){type=t;renderTabs();el('quote').classList.toggle('hidden',t!=='عرض سعر');el('preview').style.display='none'}function addRow(){const tr=document.createElement('tr');tr.innerHTML='<td><input class="row-input desc" placeholder="الخدمة"></td><td><input class="row-input qty" type="number" min="0" value="1"></td><td><input class="row-input price" type="number" min="0" value="0"></td><td><button class="remove" onclick="this.closest(\'tr\').remove()">حذف</button></td>';el('rows').appendChild(tr)}function preview(){const c=esc(el('company').value||'[اسم الجهة]'),n=esc(el('number').value||'—'),d=esc(el('date').value||'—'),r=esc(el('recipient').value||'—'),s=esc(el('subject').value||type),b=esc(el('body').value);let details='';if(type==='عرض سعر'){let sum=0;let items=[...el('rows').children].map((tr,i)=>{const desc=esc(tr.querySelector('.desc').value),q=Number(tr.querySelector('.qty').value)||0,p=Number(tr.querySelector('.price').value)||0;sum+=q*p;return '<tr><td>'+(i+1)+'</td><td>'+desc+'</td><td>'+q+'</td><td>'+p.toFixed(2)+'</td><td>'+(q*p).toFixed(2)+'</td></tr>'}).join('');let vat=sum*(Number(el('tax').value)||0)/100;details='<table><thead><tr><th>#</th><th>الوصف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>'+items+'</tbody></table><p>المجموع: '+sum.toFixed(2)+' ر.س | الضريبة: '+vat.toFixed(2)+' ر.س</p><h3>الإجمالي شامل الضريبة: '+(sum+vat).toFixed(2)+' ر.س</h3>'}el('preview').innerHTML='<div class="ph"><div><b>'+c+'</b><p>رقم المستند: '+n+'</p><p>التاريخ: '+d+'</p></div><div class="mark">TILQA<small style="display:block;font-size:13px;text-align:center">تلقا</small></div></div><h2>'+esc(type)+'</h2><p><b>إلى:</b> '+r+'</p><p><b>الموضوع:</b> '+s+'</p><div class="body">'+b+'</div>'+details+'<footer>نموذج معاينة تجريبي — TILQA</footer>';el('preview').style.display='block';el('preview').scrollIntoView({behavior:'smooth'})}function printDoc(){preview();window.print()}function resetDoc(){if(confirm('مسح البيانات الحالية؟')){document.querySelectorAll('#editor input,#editor textarea').forEach(x=>x.value='');el('rows').innerHTML='';addRow();el('preview').style.display='none'}}el('date').value=new Date().toISOString().slice(0,10);renderTabs();addRow();</script></html>
