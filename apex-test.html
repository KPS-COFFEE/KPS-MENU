<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>KPS MENU — APEX TEST</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#111}
    .badge{position:fixed;z-index:999999;top:max(10px,env(safe-area-inset-top));left:10px;padding:7px 10px;border-radius:999px;background:#f26532;color:#111;font:900 11px/1 system-ui;box-shadow:0 5px 18px rgba(0,0,0,.28);pointer-events:none}
  </style>
</head>
<body>
  <div class="badge">APEX TEST</div>
  <iframe id="menuFrame" src="index.html" title="KPS MENU"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('menuFrame');
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) throw new Error('frame document unavailable');
          if (!doc.querySelector('meta[name="kps-apex-api"]')) {
            const meta = doc.createElement('meta');
            meta.name = 'kps-apex-api';
            meta.content = 'https://kps-apex-os-v507-test.onrender.com';
            doc.head.appendChild(meta);
          }
          const script = doc.createElement('script');
          script.src = 'apex-v2-adapter.js';
          script.defer = true;
          doc.head.appendChild(script);
        } catch (error) {
          console.error('[KPS MENU TEST WRAPPER]', error);
        }
      });
    })();
  </script>
</body>
</html>
